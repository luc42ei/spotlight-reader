<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotlight Reader Options</title>
  <link rel="stylesheet" type="text/css" href="css/common.css">
  <link rel="stylesheet" type="text/css" href="css/options.css">

  <script src="js/rxjs.umd.min.js"></script>
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/aws-sdk.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/tts-engines.js"></script>
  <script src="js/options.js"></script>
  <script src="js/custom-voices.js"></script>
</head>
<body>
  <div class="container-fluid">
    <button type="button" class="close" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
    <button type="button" id="toggle-dark-mode-options" class="btn btn-sm btn-light options-dark-btn" title="Toggle dark mode">
      <i class="material-icons">&#xe51c;</i>
    </button>
    <h2>
      <span data-i18n="options_heading"></span>
    </h2>


    <div class="layout">
      <div><span data-i18n="options_language_label"></span></div>
      <div id="lang-picker" class="lang-picker">
        <button type="button" id="lang-picker-btn" class="form-control lang-picker-btn"></button>
        <div id="lang-picker-panel" class="lang-picker-panel"></div>
      </div>

      <div>
        <span data-i18n="options_voice_label"></span>
      </div>
      <div>
        <div id="voice-chips"></div>
        <input id="voice-filter" type="text" class="form-control" data-i18n-placeholder="options_voice_filter">
        <div class="voice-select-row">
          <select id="voices" class="form-control">
          </select>
          <button type="button" id="fav-toggle" class="btn btn-sm btn-light fav-btn" title="Add to favorites">
            <i class="material-icons">&#xe83a;</i>
          </button>
        </div>
        <small id="supertonic-progress" class="form-text text-muted" style="display:none"><span data-i18n="options_supertonic_downloading"></span> <span id="supertonic-progress-text"></span></small>
        <small id="auto-voice-label" class="form-text text-muted" style="display:none"></small>
        <small class="form-text auto-select-info" data-i18n="options_auto_select_info"></small>
        <small id="voice-info" class="form-text text-muted">
          <span data-i18n="options_voice_note"></span>
          <a href='http://blog.readaloud.app/2018/10/the-state-of-text-to-speech-technology.html' target='_blank' data-i18n="options_read_more"></a> <span data-i18n="options_voice_note_tail"></span>
        </small>
      </div>

      <div>
        <span data-i18n="options_rate_label"></span>
        <button id="rate-edit-button" type="button" class="btn btn-sm btn-light">
          <i class="material-icons">&#xe254;</i>
        </button>
      </div>
      <div>
        <div id="rate" class="slider" data-min="-1" data-max="1" data-steps="40" data-pow="3"></div>
        <span class="slider-value" id="rate-value"></span>
        <div id="rate-input-div">
          <input id="rate-input" class="form-control" type="text" maxlength="5" />
        </div>
        <small id="rate-warning" class="form-text warning" data-i18n="options_rate_warning"></small>
      </div>

      <div>
        <span data-i18n="options_show_highlighting"></span>
      </div>
      <div class="btn-group btn-group-sm" id="show-highlighting">
        <button type="button" class="btn btn-light" data-value="1" data-i18n="options_highlighting_popup"></button>
        <button type="button" class="btn btn-light" data-value="2" data-i18n="options_highlighting_window"></button>
        <button type="button" class="btn btn-light" data-value="3" data-i18n="options_highlighting_inpage"></button>
        <button type="button" class="btn btn-light" data-value="0" data-i18n="options_highlighting_off"></button>
      </div>

      <div class="audio-playback-visible">
        <span data-i18n="options_audio_playback"></span>
      </div>
      <select id="audio-playback" class="form-control audio-playback-visible">
        <option value="false" data-i18n="options_audio_playback_standalone"></option>
        <option value="true" data-i18n="options_audio_playback_embedded"></option>
      </select>
    </div>

    <h3 id="extra-options-heading" data-i18n="options_advanced_heading"></h3>
    <div id="extra-options">
      <input type="checkbox" id="fix-bt-silence-gap"
      ><label for="fix-bt-silence-gap" data-i18n="options_bt_silence_gap"></label>
      <input type="checkbox" id="emphasize-italics"
      ><label for="emphasize-italics" data-i18n="options_emphasize_italics"></label>
      <input type="checkbox" id="supertonic-parallel"
      ><label for="supertonic-parallel" data-i18n="options_supertonic_parallel"></label>
      <div class="extra-option-row">
        <label for="supertonic-steps" data-i18n="options_supertonic_quality"></label>
        <select id="supertonic-steps" class="form-control form-control-sm">
          <option value="6" data-i18n="options_supertonic_quality_high"></option>
          <option value="5" data-i18n="options_supertonic_quality_standard"></option>
        </select>
      </div>
    </div>

    <div class="form-group buttons">
      <button type="button" id="test-voice" class="btn btn-info">
        <div class="spinner"></div>
        <span data-i18n="options_test_button"></span>
      </button>
      <button type="button" id="reset" class="btn btn-warning" data-i18n="options_reset_button"></button>
      <span class="green-check">
        <i class="material-icons">&#xe5ca;</i>
      </span>
    </div>

    <div class="form-group">
      <small id="status" style="color: red"></small>
    </div>

    <details id="word-replacements-section">
      <summary data-i18n="options_word_replacements_heading"></summary>
      <p class="cv-subtext" data-i18n="options_word_replacements_help"></p>
      <textarea id="word-replacements" class="form-control" rows="6" spellcheck="false"
        data-i18n-placeholder="options_word_replacements_example"></textarea>
      <div class="status cv-error" id="word-replacements-errors"></div>
    </details>

    <details id="custom-voices-section">
      <summary data-i18n="options_custom_voices_heading"></summary>

      <details class="cv-provider">
        <summary>Amazon Polly</summary>
        <p class="cv-subtext" data-i18n="cv_subtext_aws"></p>
        <div class="cv-form">
          <input type="text" class="form-control" id="aws-access-key-id" data-i18n-placeholder="cv_placeholder_access_key_id">
          <input type="text" class="form-control" id="aws-secret-access-key" data-i18n-placeholder="cv_placeholder_secret_access_key">
          <button type="button" class="btn btn-sm" id="aws-save-button" data-i18n="cv_save"></button>
          <div class="spinner status progress" id="aws-progress"></div>
          <div class="status cv-success" id="aws-success"></div>
          <div class="status cv-error" id="aws-error"></div>
        </div>
      </details>

      <details class="cv-provider">
        <summary>Google Wavenet</summary>
        <p class="cv-subtext" data-i18n="cv_subtext_gcp"></p>
        <div class="cv-form">
          <input type="text" class="form-control" id="gcp-api-key" data-i18n-placeholder="cv_placeholder_api_key">
          <label class="cv-check"><input type="checkbox" id="gcp-enable-studio"> <span data-i18n="cv_include_studio"></span></label>
          <button type="button" class="btn btn-sm" id="gcp-save-button" data-i18n="cv_save"></button>
          <div class="spinner status progress" id="gcp-progress"></div>
          <div class="status cv-success" id="gcp-success"></div>
          <div class="status cv-error" id="gcp-error"></div>
        </div>
      </details>

      <details class="cv-provider">
        <summary>IBM Watson</summary>
        <p class="cv-subtext" data-i18n="cv_subtext_ibm"></p>
        <div class="cv-form">
          <input type="text" class="form-control" id="ibm-api-key" data-i18n-placeholder="cv_placeholder_api_key">
          <input type="text" class="form-control" id="ibm-url" data-i18n-placeholder="cv_placeholder_url">
          <button type="button" class="btn btn-sm" id="ibm-save-button" data-i18n="cv_save"></button>
          <div class="spinner status progress" id="ibm-progress"></div>
          <div class="status cv-success" id="ibm-success"></div>
          <div class="status cv-error" id="ibm-error"></div>
        </div>
      </details>

      <details class="cv-provider">
        <summary>Microsoft Azure</summary>
        <p class="cv-subtext" data-i18n="cv_subtext_azure"></p>
        <div class="cv-form">
          <input type="text" class="form-control" id="azure-region" placeholder="SPEECH_REGION">
          <input type="text" class="form-control" id="azure-key" placeholder="SPEECH_KEY">
          <button type="button" class="btn btn-sm" id="azure-save-button" data-i18n="cv_save"></button>
          <div class="spinner status progress" id="azure-progress"></div>
          <div class="status cv-success" id="azure-success"></div>
          <div class="status cv-error" id="azure-error"></div>
        </div>
      </details>

      <details class="cv-provider">
        <summary>OpenAI</summary>
        <p class="cv-subtext" data-i18n="cv_subtext_openai"></p>
        <div class="openai">
          <div class="view-new cv-form">
            <button type="button" class="btn btn-sm btn-add" data-i18n="cv_add"></button>
          </div>
          <div class="view-exist cv-form">
            <div><span class="text-muted" data-i18n="cv_api_url"></span> <span class="endpoint-url"></span></div>
            <div><span class="text-muted" data-i18n="cv_api_key"></span> <span class="api-key"></span></div>
            <div><span class="text-muted" data-i18n="cv_voice_list"></span> <span class="voice-list"></span></div>
            <button type="button" class="btn btn-sm btn-edit" data-i18n="cv_edit"></button>
            <button type="button" class="btn btn-sm btn-light btn-delete" data-i18n="cv_delete"></button>
          </div>
          <div class="view-edit cv-form">
            <label><span data-i18n="cv_api_url"></span><input type="text" class="form-control txt-endpoint-url"></label>
            <label><span data-i18n="cv_api_key_optional"></span><input type="password" class="form-control txt-api-key"></label>
            <label><span data-i18n="cv_voice_list"></span><textarea class="form-control txt-voice-list" rows="4"></textarea></label>
            <div class="spinner status progress"></div>
            <div class="status cv-error error"></div>
            <button type="button" class="btn btn-sm btn-save" data-i18n="cv_save"></button>
            <button type="button" class="btn btn-sm btn-light btn-cancel" data-i18n="cv_cancel"></button>
          </div>
        </div>
      </details>
    </details>

    <details id="voice-info-section">
      <summary data-i18n="options_voice_providers_heading"></summary>
      <table class="provider-table">
        <thead>
          <tr><th data-i18n="pt_provider"></th><th data-i18n="pt_type"></th><th data-i18n="pt_languages"></th><th data-i18n="pt_notes"></th><th data-i18n="pt_links"></th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Supertonic</td>
            <td><span class="badge badge-offline" data-i18n="pt_badge_offline_free"></span></td>
            <td data-i18n="pt_lang_supertonic"></td>
            <td data-i18n="pt_note_supertonic"></td>
            <td><a href="https://github.com/supertone-inc/supertonic" target="_blank">GitHub</a> · <a href="https://huggingface.co/spaces/Supertone/supertonic-2" target="_blank" data-i18n="pt_link_demo_samples"></a></td>
          </tr>
          <tr>
            <td>Piper</td>
            <td><span class="badge badge-offline" data-i18n="pt_badge_offline_free"></span></td>
            <td data-i18n="pt_lang_many"></td>
            <td data-i18n="pt_note_piper"></td>
            <td><a href="https://github.com/OHF-Voice/piper1-gpl" target="_blank">GitHub</a> · <a href="https://rhasspy.github.io/piper-samples" target="_blank" data-i18n="pt_link_voice_samples"></a></td>
          </tr>
          <tr>
            <td>Google Translate</td>
            <td><span class="badge badge-free" data-i18n="pt_badge_online_free"></span></td>
            <td data-i18n="pt_lang_many"></td>
            <td data-i18n="pt_note_gtranslate"></td>
            <td><a href="https://translate.google.com/" target="_blank">translate.google.com</a></td>
          </tr>
          <tr>
            <td>Google Wavenet / Neural2 / Chirp3-HD</td>
            <td><span class="badge badge-api" data-i18n="pt_badge_api_paid"></span></td>
            <td data-i18n="pt_lang_many"></td>
            <td data-i18n="pt_note_gcloud"></td>
            <td><a href="https://console.cloud.google.com/apis/credentials" target="_blank" data-i18n="pt_link_get_api_key"></a> · <a href="https://cloud.google.com/text-to-speech/docs/voices" target="_blank" data-i18n="pt_link_voices"></a> · <a href="https://cloud.google.com/text-to-speech/docs/chirp3-hd" target="_blank" data-i18n="pt_link_chirp_docs"></a></td>
          </tr>
          <tr>
            <td>Amazon Polly</td>
            <td><span class="badge badge-api" data-i18n="pt_badge_api_paid"></span></td>
            <td data-i18n="pt_lang_many"></td>
            <td data-i18n="pt_note_polly"></td>
            <td><a href="https://console.aws.amazon.com/iam/home#/security_credentials" target="_blank" data-i18n="pt_link_get_keys"></a> · <a href="https://docs.aws.amazon.com/polly/latest/dg/available-voices.html" target="_blank" data-i18n="pt_link_voices_samples"></a></td>
          </tr>
          <tr>
            <td>IBM Watson</td>
            <td><span class="badge badge-api" data-i18n="pt_badge_api_paid"></span></td>
            <td data-i18n="pt_lang_several"></td>
            <td data-i18n="pt_note_ibm"></td>
            <td><a href="https://cloud.ibm.com/catalog/services/text-to-speech" target="_blank" data-i18n="pt_link_get_api_key"></a> · <a href="https://www.ibm.com/demos/live/tts-demo/self-service/home" target="_blank" data-i18n="pt_link_demo_samples"></a></td>
          </tr>
          <tr>
            <td>Microsoft Azure</td>
            <td><span class="badge badge-api" data-i18n="pt_badge_api_paid"></span></td>
            <td data-i18n="pt_lang_many"></td>
            <td data-i18n="pt_note_azure"></td>
            <td><a href="https://portal.azure.com/#create/Microsoft.CognitiveServicesSpeechServices" target="_blank" data-i18n="pt_link_get_key"></a> · <a href="https://learn.microsoft.com/en-us/azure/ai-services/speech-service/text-to-speech" target="_blank" data-i18n="pt_link_docs_samples"></a></td>
          </tr>
          <tr>
            <td>OpenAI / compatible</td>
            <td><span class="badge badge-api" data-i18n="pt_badge_api_paid"></span></td>
            <td data-i18n="pt_lang_en_more"></td>
            <td data-i18n="pt_note_openai"></td>
            <td><a href="https://platform.openai.com/api-keys" target="_blank" data-i18n="pt_link_get_api_key"></a> · <a href="https://platform.openai.com/docs/guides/text-to-speech" target="_blank" data-i18n="pt_link_api_docs"></a></td>
          </tr>
        </tbody>
      </table>
    </details>

    <p class="report-link" style="margin-top:16px;text-align:center">
      🐞 <a href="https://github.com/luc42ei/spotlight-reader/issues" target="_blank" rel="noopener" data-i18n="options_report_bug"></a>
    </p>
  </div>
</body>
</html>
